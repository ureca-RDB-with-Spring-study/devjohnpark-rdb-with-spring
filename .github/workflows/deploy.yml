name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build & Test
        run: ./gradlew clean build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

  docker-push:
    needs: build-test
    runs-on: ubuntu-22.04
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.registry.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute ECR registry URL
        id: registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "url=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push image
        env:
          REGISTRY: ${{ steps.registry.outputs.url }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG \
                       -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

  deploy-ec2:
    name: Deploy to EC2 via SSM
    needs: docker-push
    runs-on: ubuntu-22.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find target EC2 instance
        id: target
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=smartclearance-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: smartclearance-app 인스턴스를 찾을 수 없음"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found instance: $INSTANCE_ID"

      - name: Generate deployment script
        env:
          REGISTRY: ${{ needs.docker-push.outputs.registry }}
          TAG: ${{ needs.docker-push.outputs.image_tag }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "ERROR: REGISTRY가 비어있음"
            exit 1
          fi

          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          echo "Image to deploy: $IMAGE"

          cat > /tmp/deploy.sh <<EOF
          #!/bin/bash
          set -e

          AWS_REGION="${AWS_REGION}"
          REGISTRY="${REGISTRY}"
          IMAGE="${IMAGE}"
          DB_HOST="${{ secrets.DB_HOST }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_USERNAME="${{ secrets.DB_USERNAME }}"
          DB_PASSWORD='${{ secrets.DB_PASSWORD }}'

          echo "==> ECR 로그인"
          aws ecr get-login-password --region \$AWS_REGION \
            | sudo docker login --username AWS --password-stdin \$REGISTRY

          echo "==> 새 이미지 pull: \$IMAGE"
          sudo docker pull \$IMAGE

          echo "==> 기존 컨테이너 정리"
          sudo docker stop app 2>/dev/null || true
          sudo docker rm app 2>/dev/null || true

          echo "==> 새 컨테이너 실행"
          sudo docker run -d \
            --name app \
            --restart=unless-stopped \
            -p 80:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_HOST="\$DB_HOST" \
            -e DB_PORT=3306 \
            -e DB_NAME="\$DB_NAME" \
            -e DB_USERNAME="\$DB_USERNAME" \
            -e DB_PASSWORD="\$DB_PASSWORD" \
            \$IMAGE

          echo "==> 헬스체크 (최대 60초 대기)"
          for i in {1..30}; do
            if curl -fsS http://localhost/actuator/health > /dev/null 2>&1; then
              echo "Healthy!"
              exit 0
            fi
            echo "Waiting... (\$i/30)"
            sleep 2
          done

          echo "헬스체크 실패. 컨테이너 로그:"
          sudo docker logs app
          exit 1
          EOF

          jq -Rs '{commands: [.]}' /tmp/deploy.sh > /tmp/params.json
          echo "Script size: $(wc -l < /tmp/deploy.sh) lines"

      - name: Send SSM command
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          TAG: ${{ needs.docker-push.outputs.image_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${TAG}" \
            --parameters file:///tmp/params.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "Command ID: $COMMAND_ID"

          echo "==> 명령 실행 완료 대기 (최대 5분)"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

      - name: Print SSM execution result
        if: always() && steps.ssm.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)
          echo "Status: $STATUS"

          echo ""
          echo "==> 표준 출력"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

          echo ""
          echo "==> 표준 에러"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text

          [ "$STATUS" = "Success" ] || exit 1
