spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appdb}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
